<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Lake Washington Chess Center</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <a href="index.html">
                <img src="logo-image.png" alt="LWCC Logo">
            </a>
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="gallery.html" class="active">Gallery</a></li>
            <li><a href="resources.html">Resources</a></li>
        </ul>
    </nav>

    <header class="hero" style="padding: 60px 20px;">
        <h1>Photo Gallery</h1>
        <p>Memories from past tournaments, classes, and community events.</p>
    </header>

    <main>
        <section id="gallery">
            <div class="section-title">
                <h2>Past Events</h2>
                <p style="max-width: 600px; margin: 0 auto; color: var(--text-dim);">
                    More photos will be added as we continue to grow our community.
                </p>
            </div>

            <div class="gallery-grid">
                <img src="gallery/img1.jpg" alt="MLK Chess Tournament">
                <img src="gallery/img2.jpg" alt="MLK Chess Tournament">
                <img src="gallery/img3.jpg" alt="MLK Chess Tournament">
                <img src="gallery/img4.jpg" alt="MLK Chess Tournament">
                <img src="gallery/img5.jpg" alt="MLK Chess Tournament">
                <img src="gallery/img6.jpg" alt="MLK Chess Tournament">
                <img src="gallery/img7.jpg" alt="Rising Star New Year Tournament">
                <img src="gallery/IMG_3463.jpg" alt="Rising Star New Year Tournament">
                <img src="gallery/IMG_3468.jpg" alt="Rising Star New Year Tournament">
                <img src="gallery/IMG_3471.jpg" alt="Rising Star New Year Tournament">
                <img src="gallery/IMG_3476.jpg" alt="Rising Star New Year Tournament">
                <img src="gallery/IMG_3477.jpg" alt="Rising Star New Year Tournament">
            </div>
        </section>
    </main>
</body>
</html>
